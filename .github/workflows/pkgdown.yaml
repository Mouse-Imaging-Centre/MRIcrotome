# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Builds the pkgdown site on every PR (to catch errors) and deploys it to the
# gh-pages branch on pushes to master. GitHub Pages must be set to serve the
# gh-pages branch (Settings > Pages) for the site to be online.
on:
  push:
    branches: [main, master]
    # deploy only when a file that the site is made from changes (as in
    # RMINC's pkgdown workflow)
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - 'NAMESPACE'
      - 'DESCRIPTION'
      - 'README.md'
      - 'NEWS.md'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deploy at a time
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
