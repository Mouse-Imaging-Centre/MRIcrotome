# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  # no branch filter, so that stacked PRs (based on another PR's branch) are
  # checked too
  pull_request:
  # run by hand, e.g. to check an old PR again after its runs have expired
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          # the oldest R that current purrr and testthat support; the README
          # gives it as the oldest R that is checked
          - {os: ubuntu-latest, r: '4.1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # CRAN builds the PDF manual, so check it here rather than finding Rd or
      # LaTeX problems on submission. This is why the check below passes neither
      # --no-manual nor build_args.
      - uses: r-lib/actions/setup-tinytex@v2

      # The PDF manual sets code and URLs in a fixed-width font: inconsolata,
      # or courier when it is missing. TinyTeX on some runners (R-devel,
      # Windows) has neither, and the manual fails with "Font T1/pcr/m/n/10
      # = pcrr8t not loadable".
      - name: Install LaTeX fonts for the manual
        run: tlmgr install courier inconsolata

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, any::vdiffr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'
