# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    # changes that cannot change the result of R CMD check (as in RMINC's CI)
    paths-ignore:
      - 'docs/**'
      - '**/README*'
      - 'cran-comments.md'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  # no branch filter, so that stacked PRs (based on another PR's branch) are
  # checked too
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README*'
      - 'cran-comments.md'
      - '_pkgdown.yml'
      - '.github/workflows/pkgdown.yaml'
  # run by hand, e.g. to check an old PR again after its runs have expired
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          # the oldest R that current purrr and testthat support; this job is
          # the evidence for "Depends: R (>= 4.1)" in DESCRIPTION
          - {os: ubuntu-latest, r: '4.1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # CRAN builds the PDF manual, so check it here rather than finding Rd or
      # LaTeX problems on submission. This is why the check below passes neither
      # --no-manual nor build_args.
      - uses: r-lib/actions/setup-tinytex@v2

      # The PDF manual sets code and URLs in a fixed-width font: inconsolata,
      # or courier when it is missing, and makes its index with makeindex.
      # TinyTeX on some runners (R-devel, Windows) lacks them, and the
      # manual fails with "Font T1/pcr/m/n/10=pcrr8t not loadable" or with
      # "LaTeX errors found" and no detail.
      - name: Install LaTeX fonts for the manual
        run: tlmgr install courier inconsolata makeindex

      # HTML Tidy lets R CMD check validate the HTML manual; without it the
      # check skips that step with a NOTE (as in RMINC's CI)
      - name: Install HTML Tidy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tidy

      - name: Install HTML Tidy (macOS)
        if: runner.os == 'macOS'
        run: brew install tidy-html5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, any::vdiffr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'

      # R CMD check passes when a test gives a warning, but a new warning
      # (often from a new R or package version) should be seen; RMINC's CI
      # fails on test warnings too
      - name: Fail on test warnings
        shell: bash
        run: |
          out=check/MRIcrotome.Rcheck/tests/testthat.Rout
          grep -E 'FAIL [0-9]+ \| WARN [0-9]+' "$out" | tail -1
          if grep -qE 'WARN [1-9]' "$out"; then
            echo "::error::The tests gave warnings; see $out in the check output"
            exit 1
          fi
